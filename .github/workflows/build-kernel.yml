name: "Build NetHunter Kernel — Pixel 3 (blueline/crosshatch)"

on:
  workflow_dispatch:
    inputs:
      ANDROID_VERSION:
        description: 'Android version label for AnyKernel3'
        required: true
        default: '13,14,15'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: thirteen
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio flex \
            git libelf-dev libncurses5-dev libssl-dev lz4 \
            python3 unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            clang-12 lld-12 llvm-12 \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf

          # Create unversioned symlinks so the kernel sub-Makefiles can find them
          sudo ln -sf /usr/bin/clang-12        /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-12       /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-12      /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-12      /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-12 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-12 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-12   /usr/local/bin/llvm-strip

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export CC=clang-12
          export LD=ld.lld-12
          export AR=llvm-ar-12
          export NM=llvm-nm-12
          export OBJCOPY=llvm-objcopy-12
          export OBJDUMP=llvm-objdump-12
          export STRIP=llvm-strip-12
          export CLANG_TRIPLE=aarch64-linux-gnu-

          clang-12 --version
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabihf-gcc --version

          mkdir -p out

          echo "==> Building defconfig"
          make O=out ARCH=arm64 b1c1_defconfig

          echo "==> Disabling COMPAT_VDSO (avoids arm32 assembler issues)"
          echo "CONFIG_COMPAT_VDSO=n" >> out/.config
          make O=out ARCH=arm64 olddefconfig

          echo "==> Building kernel ($(nproc) jobs)"
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            CC=clang-12 \
            LD=ld.lld-12 \
            AR=llvm-ar-12 \
            NM=llvm-nm-12 \
            OBJCOPY=llvm-objcopy-12 \
            OBJDUMP=llvm-objdump-12 \
            STRIP=llvm-strip-12 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc) 2>&1 | tee build.log

          echo "==> Check output"
          ls out/arch/arm64/boot/ || { echo "BUILD FAILED"; tail -80 build.log; exit 1; }

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          cat > AnyKernel3/anykernel.sh << 'AKEOF'
          # AnyKernel3 — Alynx NetHunter Kernel for Pixel 3 / 3XL
          properties() { '
          kernel.string=Alynx NetHunter Kernel by V3rB0se @ Android 13-15
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=blueline
          device.name2=crosshatch
          device.name3=bluecross
          supported.versions=13-15
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          . tools/busybox.sh;
          split_boot;
          flash_boot;
          AKEOF

          for img in Image.lz4-dtb Image.lz4 Image.gz-dtb Image.gz Image; do
            if [ -f "out/arch/arm64/boot/$img" ]; then
              cp "out/arch/arm64/boot/$img" AnyKernel3/
              echo "Copied: $img"
              break
            fi
          done

          ls AnyKernel3/Image* 2>/dev/null || { echo "ERROR: No kernel image!"; exit 1; }

          cd AnyKernel3
          zip -r9 ../Alynx-NetHunter-Pixel3-a15.zip . -x .git\* -x README.md
          cd ..
          ls -lh Alynx-NetHunter-Pixel3-a15.zip

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Alynx-NetHunter-Pixel3-a15
          path: |
            Alynx-NetHunter-Pixel3-a15.zip
            out/arch/arm64/boot/Image*
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
