name: "Build NetHunter Kernel — Pixel 3 (blueline/crosshatch)"

on:
  workflow_dispatch:
    inputs:
      ANDROID_VERSION:
        description: 'Android version label for AnyKernel3'
        required: true
        default: '13,14,15'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: thirteen
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio flex \
            git libelf-dev libncurses5-dev libssl-dev lz4 \
            python3 python3-pip unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libc6-dev-arm64-cross libc6-dev-armhf-cross

      - name: Set up Clang 12 toolchain
        run: |
          mkdir -p $HOME/toolchain/clang
          cd $HOME/toolchain
          # Use clang from LLVM apt repo
          wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 12 || true
          # Fallback: use distro clang
          sudo apt-get install -y clang-12 2>/dev/null || sudo apt-get install -y clang
          CLANG_BIN=$(which clang-12 2>/dev/null || which clang)
          echo "Using clang: $CLANG_BIN"
          $CLANG_BIN --version

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export CC=$(which clang-12 2>/dev/null || which clang)
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          # Install lld if needed
          sudo apt-get install -y lld llvm 2>/dev/null || true

          echo "Toolchain versions:"
          $CC --version
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabihf-gcc --version

          mkdir -p out

          echo "==> Building defconfig"
          make O=out ARCH=arm64 b1c1_defconfig

          echo "==> Building kernel ($(nproc) jobs)"
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            CC=$CC \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=${LD:-ld} \
            AR=${AR:-ar} \
            NM=${NM:-nm} \
            OBJCOPY=${OBJCOPY:-objcopy} \
            OBJDUMP=${OBJDUMP:-objdump} \
            STRIP=${STRIP:-strip} \
            -j$(nproc) 2>&1 | tee build.log

          echo "==> Check output"
          ls out/arch/arm64/boot/ || { echo "BUILD FAILED"; tail -50 build.log; exit 1; }

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          cat > AnyKernel3/anykernel.sh << 'AKEOF'
          # AnyKernel3 — Alynx NetHunter Kernel for Pixel 3 / 3XL
          properties() { '
          kernel.string=Alynx NetHunter Kernel by V3rB0se @ Android 13-15
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=blueline
          device.name2=crosshatch
          device.name3=bluecross
          supported.versions=13-15
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          . tools/busybox.sh;
          split_boot;
          flash_boot;
          AKEOF

          for img in Image.lz4-dtb Image.lz4 Image.gz-dtb Image.gz Image; do
            if [ -f "out/arch/arm64/boot/$img" ]; then
              cp "out/arch/arm64/boot/$img" AnyKernel3/
              echo "Using kernel image: $img"
              break
            fi
          done

          ls AnyKernel3/Image* 2>/dev/null || echo "WARNING: No kernel image copied!"

          cd AnyKernel3
          zip -r9 ../Alynx-NetHunter-Pixel3-a15.zip . -x .git\* -x README.md
          cd ..
          ls -lh Alynx-NetHunter-Pixel3-a15.zip

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Alynx-NetHunter-Pixel3-a15
          path: |
            Alynx-NetHunter-Pixel3-a15.zip
            out/arch/arm64/boot/Image*
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
